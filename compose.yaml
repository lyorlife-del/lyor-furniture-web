services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lyor
      POSTGRES_USER: lyor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyor_local_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyor -d lyor"]
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
volumes:
  postgres-data:
  redis-data:
